# Installed as /etc/needrestart/conf.d/pihole-autoupdate.conf
#
# needrestart's default behaviour is to prompt during apt runs, or on some
# systems to restart services by itself. Either would break an unattended 3am
# update: a prompt hangs the run until it times out, and an automatic restart
# takes decisions this workflow needs to make in a specific order.
#
# 'l' means list only. needrestart reports; pihole-node.sh decides.
$nrconf{restart} = 'l';

# Suppress the interactive kernel banner. The workflow reads NEEDRESTART-KSTA
# from `needrestart -b` instead.
$nrconf{kernelhints} = 0;
